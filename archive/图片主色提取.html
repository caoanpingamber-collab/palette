<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片主色提取 · Dominant Color Extractor</title>
<style>
  :root{
    --bg:#ffffff; --surface:#f6f6f4; --surface2:#efefec;
    --text:#1d1d1b; --text2:#6b6b66; --text3:#9a9a94;
    --border:rgba(0,0,0,.12); --border2:rgba(0,0,0,.22);
    --info-bg:#e6f1fb; --info-fg:#0c447c; --info-bd:#378add;
    --ok-bg:#e1f5ee; --ok-fg:#0f6e56; --bad-bg:#fceaea; --bad-fg:#a32d2d;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --r:8px; --r-lg:12px;
  }
  [data-theme="dark"]{
    --bg:#1b1b1d; --surface:#262628; --surface2:#303033;
    --text:#f1f1ef; --text2:#a6a6a1; --text3:#737370;
    --border:rgba(255,255,255,.14); --border2:rgba(255,255,255,.28);
    --info-bg:#16344e; --info-fg:#9ccbf2; --info-bd:#378add;
    --ok-bg:#123a30; --ok-fg:#6fd3b5; --bad-bg:#3d1818; --bad-fg:#e98a8a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  main{max-width:760px;margin:0 auto;padding:34px 22px 64px;}
  h1{font-size:21px;font-weight:600;margin:0;}
  .sub{color:var(--text2);font-size:13px;margin:5px 0 0;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px;}
  .iconbtn{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:var(--r);width:36px;height:36px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .iconbtn:hover{background:var(--surface);}
  .drop{border:1.5px dashed var(--border2);border-radius:var(--r-lg);padding:34px 16px;text-align:center;cursor:pointer;color:var(--text2);font-size:14px;transition:.15s;}
  .drop:hover,.drop.over{background:var(--surface);border-color:var(--info-bd);color:var(--text);}
  .drop svg{width:26px;height:26px;opacity:.7;margin-bottom:6px;}
  .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px;}
  .ctl .lbl{font-size:13px;color:var(--text2);}
  .seg{display:flex;gap:6px;}
  .seg button{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:var(--r);padding:5px 13px;cursor:pointer;font-size:14px;font-family:var(--mono);}
  .seg button.on{border-color:var(--info-bd);background:var(--info-bg);color:var(--info-fg);}
  .seg button:hover:not(.on){background:var(--surface);}
  .btn{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--surface);}
  .btn svg{width:15px;height:15px;}
  .thumb{width:50px;height:50px;object-fit:cover;border-radius:var(--r);border:1px solid var(--border);}
  .toast{font-size:12px;color:var(--ok-fg);min-width:44px;}
  .bar{display:flex;height:18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);margin:16px 0;}
  .row{display:flex;gap:15px;align-items:stretch;padding:13px 0;border-top:1px solid var(--border);}
  .chip{width:96px;min-height:96px;flex:0 0 96px;border-radius:var(--r);display:flex;align-items:flex-end;padding:8px;cursor:pointer;position:relative;}
  .chip span{font-size:15px;font-weight:600;}
  .chip .tag{position:absolute;top:7px;right:7px;font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.82);color:#0c447c;}
  .vals{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 20px;align-content:center;}
  .v{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;color:var(--text);}
  .v b{font-family:var(--sans);font-weight:600;color:var(--text2);width:34px;font-size:12px;}
  .cp{margin-left:auto;cursor:pointer;color:var(--text3);display:flex;}
  .cp svg{width:15px;height:15px;}
  .cp:hover{color:var(--text);}
  .cold{display:flex;align-items:center;gap:16px;margin-top:18px;background:var(--surface);border-radius:var(--r);padding:15px 17px;flex-wrap:wrap;}
  .cold .num{font-size:25px;font-weight:600;}
  .cold input{width:52px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 6px;font-family:var(--mono);font-size:13px;text-align:center;}
  .pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:var(--r);}
  .hint{font-size:12px;color:var(--text3);}
  footer{margin-top:34px;font-size:12px;color:var(--text3);text-align:center;}
  .hidden{display:none;}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>图片主色提取</h1>
      <p class="sub">拖拽 / 点击 / 粘贴(⌘V) 一张图，提取主色及占比，每色给 HEX · RGB · HSB · HSL</p>
    </div>
    <button id="theme" class="iconbtn" title="切换深浅色">◐</button>
  </div>

  <div id="drop" class="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 16l4.5-4.5a2 2 0 0 1 2.8 0L16 16"/><path d="M14 14l1.5-1.5a2 2 0 0 1 2.8 0L20 14"/><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.4"/></svg>
    <div>拖拽图片到这里 · 点击上传 · 或直接粘贴 ⌘V</div>
  </div>
  <input id="file" type="file" accept="image/*" class="hidden">

  <div id="result" class="hidden">
    <div class="ctl">
      <img id="thumb" class="thumb" alt="preview">
      <span class="lbl">颜色数</span>
      <span id="kbtns" class="seg"></span>
      <button id="copyjson" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>复制 JSON</button>
      <button id="dljson" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg>下载 JSON</button>
      <button id="dlpng" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="8.5" cy="9" r="1.3"/></svg>下载 PNG</button>
      <span id="toast" class="toast"></span>
    </div>
    <div id="bar" class="bar"></div>
    <div id="rows"></div>
    <div class="cold">
      <div>
        <div class="lbl">冷色占比</div>
        <div id="coldnum" class="num">–</div>
      </div>
      <span id="pill" class="pill"></span>
      <div class="lbl" style="display:flex;align-items:center;gap:6px;">hue
        <input id="hmin" type="number" min="0" max="360" value="160"> –
        <input id="hmax" type="number" min="0" max="360" value="270">°
      </div>
      <div class="hint" style="margin-left:auto;max-width:200px;">阈值可改，实时重算（默认 ≥60% 判达标）</div>
    </div>
  </div>

  <footer>本地运行 · 图片不上传 · k-means(k-means++ / 固定种子，结果可复现)</footer>
</main>

<script>
(function(){
  var k=4,lastImg=null,clusters=[],total=0,palette=[];
  var $=function(id){return document.getElementById(id);};
  var drop=$('drop'),file=$('file'),result=$('result'),rows=$('rows'),bar=$('bar'),thumb=$('thumb'),
      kbtns=$('kbtns'),coldnum=$('coldnum'),pill=$('pill'),toast=$('toast'),hmin=$('hmin'),hmax=$('hmax');

  $('theme').onclick=function(){var r=document.documentElement;var d=r.getAttribute('data-theme')==='dark';r.setAttribute('data-theme',d?'light':'dark');};

  [3,4,5,6].forEach(function(n){var b=document.createElement('button');b.textContent=n;if(n===k)b.className='on';
    b.onclick=function(){k=n;[].forEach.call(kbtns.children,function(c){c.className=+c.textContent===k?'on':'';});if(lastImg)process(lastImg);};kbtns.appendChild(b);});

  function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h,s,l=(mx+mn)/2;if(mx===mn){h=s=0;}else{var d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}return[h*360,s*100,l*100];}
  function rgb2hsb(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h,s=mx===0?0:d/mx,v=mx;if(d===0)h=0;else{if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}return[h*360,s*100,v*100];}
  function hx(r,g,b){return'#'+[r,g,b].map(function(x){return('0'+x.toString(16)).slice(-2);}).join('').toUpperCase();}
  function lum(r,g,b){return .2126*r+.7152*g+.0722*b;}
  function R(n){return Math.round(n);}

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function hash(data){var h=2166136261;for(var i=0;i<data.length;i+=4){h^=data[i];h=Math.imul(h,16777619);h^=data[i+1];h=Math.imul(h,16777619);h^=data[i+2];h=Math.imul(h,16777619);}return h>>>0;}

  function kmeans(pts,k,rng){var n=pts.length;if(!n)return[];var cs=[pts[(rng()*n)|0].slice()];
    while(cs.length<k){var d2=new Array(n),sum=0;for(var i=0;i<n;i++){var m=Infinity;for(var c=0;c<cs.length;c++){var dd=Math.pow(pts[i][0]-cs[c][0],2)+Math.pow(pts[i][1]-cs[c][1],2)+Math.pow(pts[i][2]-cs[c][2],2);if(dd<m)m=dd;}d2[i]=m;sum+=m;}
      var r=rng()*sum,idx=0;for(idx=0;idx<n-1;idx++){r-=d2[idx];if(r<=0)break;}cs.push(pts[idx].slice());}
    var assign=new Array(n).fill(0);
    for(var it=0;it<16;it++){for(var i2=0;i2<n;i2++){var mm=Infinity,mi=0;for(var c2=0;c2<k;c2++){var e=Math.pow(pts[i2][0]-cs[c2][0],2)+Math.pow(pts[i2][1]-cs[c2][1],2)+Math.pow(pts[i2][2]-cs[c2][2],2);if(e<mm){mm=e;mi=c2;}}assign[i2]=mi;}
      var sm=[];for(var s=0;s<k;s++)sm.push([0,0,0,0]);for(var i3=0;i3<n;i3++){var a=assign[i3];sm[a][0]+=pts[i3][0];sm[a][1]+=pts[i3][1];sm[a][2]+=pts[i3][2];sm[a][3]++;}
      for(var c3=0;c3<k;c3++)if(sm[c3][3])cs[c3]=[sm[c3][0]/sm[c3][3],sm[c3][1]/sm[c3][3],sm[c3][2]/sm[c3][3]];}
    var cnt=new Array(k).fill(0);for(var i4=0;i4<n;i4++)cnt[assign[i4]]++;
    return cs.map(function(c,i){return{rgb:[R(c[0]),R(c[1]),R(c[2])],count:cnt[i]};}).filter(function(c){return c.count>0;});}

  function process(img){var d=160,w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,d/Math.max(w,h)),cw=Math.max(1,R(w*sc)),ch=Math.max(1,R(h*sc));
    var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;var ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,cw,ch);
    var data;try{data=ctx.getImageData(0,0,cw,ch).data;}catch(e){return;}
    var pts=[];for(var i=0;i<data.length;i+=4){if(data[i+3]<125)continue;pts.push([data[i],data[i+1],data[i+2]]);}
    var rng=mulberry32((hash(data)^(k*2654435761))>>>0);
    clusters=kmeans(pts,k,rng).sort(function(a,b){return b.count-a.count;});
    total=clusters.reduce(function(a,c){return a+c.count;},0);
    render();}

  var copyIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
  function vrow(l,v){return '<div class="v"><b>'+l+'</b><span>'+v+'</span><span class="cp" data-c="'+v+'">'+copyIcon+'</span></div>';}

  function render(){if(!total)return;
    bar.innerHTML=clusters.map(function(c){return '<div style="flex:0 0 '+(c.count/total*100)+'%;background:'+hx(c.rgb[0],c.rgb[1],c.rgb[2])+'"></div>';}).join('');
    palette=[];
    rows.innerHTML=clusters.map(function(c){var r=c.rgb[0],g=c.rgb[1],b=c.rgb[2],p=c.count/total*100,hsl=rgb2hsl(r,g,b),hsb=rgb2hsb(r,g,b),H=R(hsl[0]),txt=lum(r,g,b)>150?'#000':'#fff';
      palette.push({hex:hx(r,g,b),rgb:[r,g,b],hsb:[H,R(hsb[1]),R(hsb[2])],hsl:[H,R(hsl[1]),R(hsl[2])],ratio:+p.toFixed(1)});
      return '<div class="row"><div class="chip" data-c="'+hx(r,g,b)+'" style="background:'+hx(r,g,b)+';color:'+txt+'" title="点击复制 HEX"><span>'+p.toFixed(1)+'%</span></div><div class="vals">'+
        vrow('HEX',hx(r,g,b))+vrow('RGB',r+', '+g+', '+b)+vrow('HSB',H+'°, '+R(hsb[1])+'%, '+R(hsb[2])+'%')+vrow('HSL',H+'°, '+R(hsl[1])+'%, '+R(hsl[2])+'%')+'</div></div>';}).join('');
    recomputeCold();
    result.classList.remove('hidden');}

  function recomputeCold(){if(!total)return;var lo=+hmin.value,hi=+hmax.value,cold=0;
    clusters.forEach(function(c){var hsl=rgb2hsl(c.rgb[0],c.rgb[1],c.rgb[2]);if(hsl[0]>=lo&&hsl[0]<=hi&&hsl[1]>12)cold+=c.count/total*100;});
    coldnum.textContent=cold.toFixed(1)+'%';var ok=cold>=60;
    pill.textContent=ok?'达标 ≥60%':'未达标 <60%';
    pill.style.background=ok?'var(--ok-bg)':'var(--bad-bg)';pill.style.color=ok?'var(--ok-fg)':'var(--bad-fg)';}
  hmin.oninput=recomputeCold;hmax.oninput=recomputeCold;

  function flash(t){toast.textContent=t;setTimeout(function(){toast.textContent='';},1100);}
  function cp(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){flash('已复制');},fb);}else fb();
    function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flash('已复制');}catch(e){}document.body.removeChild(ta);}}
  rows.addEventListener('click',function(e){var c=e.target.closest('.cp');if(c){cp(c.getAttribute('data-c'));return;}var ch=e.target.closest('.chip');if(ch)cp(ch.getAttribute('data-c'));});
  $('copyjson').onclick=function(){cp(JSON.stringify(palette,null,2));};
  $('dljson').onclick=function(){var blob=new Blob([JSON.stringify(palette,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='palette.json';a.click();URL.revokeObjectURL(a.href);};

  function rr(x,X,Y,W,H,Rr){x.beginPath();x.moveTo(X+Rr,Y);x.arcTo(X+W,Y,X+W,Y+H,Rr);x.arcTo(X+W,Y+H,X,Y+H,Rr);x.arcTo(X,Y+H,X,Y,Rr);x.arcTo(X,Y,X+W,Y,Rr);x.closePath();}
  function exportPNG(){if(!palette.length)return;var dark=document.documentElement.getAttribute('data-theme')==='dark';
    var C=dark?{bg:'#161618',text:'#F4F4F5',muted:'#9A9AA2',faint:'#6E6E76',border:'rgba(255,255,255,.10)',card:'rgba(255,255,255,.05)'}:{bg:'#FFFFFF',text:'#18181B',muted:'#6B7280',faint:'#9CA3AF',border:'rgba(0,0,0,.09)',card:'#F4F4F6'};
    var s=2,W=900,P=40,cw=W-2*P,barH=24,afterBar=30,rowH=128,coldGap=26,coldH=104,n=palette.length;
    var Hh=P+barH+afterBar+n*rowH+coldGap+coldH+P;
    var cv=document.createElement('canvas');cv.width=W*s;cv.height=Hh*s;var x=cv.getContext('2d');x.scale(s,s);
    x.fillStyle=C.bg;x.fillRect(0,0,W,Hh);
    var tot=clusters.reduce(function(a,c){return a+c.count;},0);
    x.save();rr(x,P,P,cw,barH,12);x.clip();var bx=P;clusters.forEach(function(c){var w=c.count/tot*cw;x.fillStyle=hx(c.rgb[0],c.rgb[1],c.rgb[2]);x.fillRect(bx,P,Math.ceil(w)+1,barH);bx+=w;});x.restore();
    function dv(vx,vy,l,v){x.textBaseline='middle';x.textAlign='left';x.font='600 13px sans-serif';x.fillStyle=C.faint;x.fillText(l,vx,vy);x.font='400 15px monospace';x.fillStyle=C.text;x.fillText(v,vx+44,vy);}
    var y0=P+barH+afterBar;
    palette.forEach(function(p,i){var ry=y0+i*rowH;if(i>0){x.strokeStyle=C.border;x.lineWidth=1;x.beginPath();x.moveTo(P,ry+0.5);x.lineTo(P+cw,ry+0.5);x.stroke();}
      var chipY=ry+(rowH-96)/2;rr(x,P,chipY,96,96,16);x.fillStyle=p.hex;x.fill();
      var lm=.2126*p.rgb[0]+.7152*p.rgb[1]+.0722*p.rgb[2];x.fillStyle=lm>150?'#0C0C0E':'#fff';x.font='600 19px monospace';x.textAlign='left';x.textBaseline='alphabetic';x.fillText(p.ratio.toFixed(1)+'%',P+10,chipY+96-12);
      var vx1=P+96+30,vx2=vx1+360,cy=ry+rowH/2;
      dv(vx1,cy-18,'HEX',p.hex);dv(vx2,cy-18,'RGB',p.rgb.join(', '));dv(vx1,cy+18,'HSB',p.hsb[0]+'°, '+p.hsb[1]+'%, '+p.hsb[2]+'%');dv(vx2,cy+18,'HSL',p.hsl[0]+'°, '+p.hsl[1]+'%, '+p.hsl[2]+'%');});
    var coldY=y0+n*rowH+coldGap;rr(x,P,coldY,cw,coldH,16);x.fillStyle=C.card;x.fill();
    x.textAlign='left';x.textBaseline='alphabetic';x.font='400 13px sans-serif';x.fillStyle=C.muted;x.fillText('冷色占比',P+24,coldY+34);
    var lo=+hmin.value,hi=+hmax.value,cold=0;clusters.forEach(function(c){var h=rgb2hsl(c.rgb[0],c.rgb[1],c.rgb[2]);if(h[0]>=lo&&h[0]<=hi&&h[1]>12)cold+=c.count/tot*100;});
    x.font='600 32px monospace';x.fillStyle=C.text;x.fillText(cold.toFixed(1)+'%',P+24,coldY+76);
    var ok=cold>=60,pt=ok?'达标 ≥60%':'未达标 <60%';x.font='600 13px sans-serif';var pw=x.measureText(pt).width+26,pxx=P+184,pyy=coldY+coldH/2-15;
    rr(x,pxx,pyy,pw,30,15);x.fillStyle=ok?(dark?'rgba(16,185,129,.18)':'#DCFCE7'):(dark?'rgba(236,72,153,.18)':'#FCE7F3');x.fill();
    x.fillStyle=ok?'#10B981':'#EC4899';x.textBaseline='middle';x.fillText(pt,pxx+13,pyy+16);
    x.font='400 13px sans-serif';x.fillStyle=C.muted;x.fillText('hue '+lo+'–'+hi+'°',pxx+pw+22,pyy+16);
    x.textAlign='right';x.textBaseline='alphabetic';x.font='400 12px sans-serif';x.fillStyle=C.faint;x.fillText('Palette',P+cw,coldY+coldH-14);
    cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='palette.png';a.click();URL.revokeObjectURL(a.href);flash('PNG 已下载');},'image/png');}
  $('dlpng').onclick=exportPNG;

  function load(src){var img=new Image();img.onload=function(){lastImg=img;thumb.src=src;process(img);};img.src=src;}
  function handle(f){if(!f||!/^image\//.test(f.type))return;var rd=new FileReader();rd.onload=function(ev){load(ev.target.result);};rd.readAsDataURL(f);}
  drop.onclick=function(){file.click();};
  file.onchange=function(e){handle(e.target.files[0]);};
  drop.ondragover=function(e){e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=function(){drop.classList.remove('over');};
  drop.ondrop=function(e){e.preventDefault();drop.classList.remove('over');handle(e.dataTransfer.files[0]);};
  window.addEventListener('paste',function(e){var it=(e.clipboardData||{}).items||[];for(var i=0;i<it.length;i++)if(it[i].type.indexOf('image')===0){handle(it[i].getAsFile());break;}});
})();
</script>
</body>
