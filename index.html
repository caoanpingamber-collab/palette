<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette · 图片主色提取</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#3B82F6; --secondary:#8B5CF6; --accent:#EC4899;
    --bg:#0C0C0E; --bg-alt:#18181B;
    --surface:rgba(255,255,255,.06); --surface-hover:rgba(255,255,255,.10);
    --text:#F4F4F5; --text-muted:#A1A1AA; --text-faint:#71717A;
    --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.16);
    --glass-blur:blur(24px);
    --ok-bg:rgba(16,185,129,.14); --ok-fg:#34D399; --ok-glow:rgba(16,185,129,.28);
    --bad-bg:rgba(236,72,153,.14); --bad-fg:#F472B6; --bad-glow:rgba(236,72,153,.26);
    --glow-blue:0 0 50px rgba(59,130,246,.22);
    --display:'Space Grotesk','PingFang SC',sans-serif;
    --sans:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:24px; --r-full:9999px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  [data-theme="light"]{
    --bg:#F5F5F7; --bg-alt:#FFFFFF;
    --surface:rgba(255,255,255,.72); --surface-hover:rgba(255,255,255,.9);
    --text:#18181B; --text-muted:#52525B; --text-faint:#9CA3AF;
    --border:rgba(0,0,0,.08); --border-hover:rgba(0,0,0,.16);
    --glow-blue:0 12px 40px rgba(59,130,246,.16);
  }
  *{box-sizing:border-box;margin:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(620px circle at 82% -8%,rgba(59,130,246,.20),transparent 58%),radial-gradient(520px circle at -8% 112%,rgba(139,92,246,.16),transparent 60%);}
  [data-theme="light"] body::before{background:radial-gradient(620px circle at 82% -8%,rgba(59,130,246,.10),transparent 58%),radial-gradient(520px circle at -8% 112%,rgba(139,92,246,.08),transparent 60%);}
  .wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:0 24px 96px;}

  nav{display:flex;align-items:center;justify-content:space-between;padding:24px 0;}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;}
  .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#3B82F6,#8B5CF6);box-shadow:var(--glow-blue);}
  .mark span{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:9px 0 0 rgba(255,255,255,.55),0 9px 0 #EC4899;transform:translate(-4px,-4px);}
  .ghost{width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;display:grid;place-items:center;backdrop-filter:var(--glass-blur);transition:var(--ease) .2s;}
  .ghost:hover{color:var(--text);border-color:var(--border-hover);}
  .ghost svg{width:17px;height:17px;}

  header.hero{text-align:center;padding:46px 0 34px;}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-full);padding:6px 14px;backdrop-filter:var(--glass-blur);margin-bottom:22px;}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok-fg);box-shadow:0 0 8px var(--ok-glow);}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.04;letter-spacing:-.025em;}
  h1 em{font-style:normal;color:var(--primary);}
  .lead{margin:18px auto 0;max-width:520px;color:var(--text-muted);font-size:16px;}

  .panel{margin-top:40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);backdrop-filter:var(--glass-blur);padding:26px;box-shadow:var(--glow-blue);}
  [data-theme="light"] .panel{box-shadow:0 16px 48px rgba(0,0,0,.06);}

  .drop{border:1.5px dashed var(--border-hover);border-radius:var(--r-lg);padding:52px 20px;text-align:center;cursor:pointer;color:var(--text-muted);transition:var(--ease) .25s;}
  .drop:hover,.drop.over{border-color:var(--primary);background:var(--surface-hover);color:var(--text);transform:translateY(-1px);}
  .drop .ic{width:54px;height:54px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;background:var(--surface-hover);border:1px solid var(--border);}
  .drop .ic svg{width:26px;height:26px;color:var(--primary);}
  .drop .t1{font-size:16px;color:var(--text);font-weight:500;}
  .drop .t2{font-size:13px;margin-top:6px;}

  .result{display:none;animation:rise .5s var(--ease);}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  .ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .thumb{width:52px;height:52px;border-radius:var(--r-md);object-fit:cover;border:1px solid var(--border);cursor:pointer;transition:var(--ease) .2s;}
  .thumb:hover{border-color:var(--primary);box-shadow:var(--glow-blue);}
  .lbl{font-size:13px;color:var(--text-muted);}
  .seg{display:flex;gap:6px;background:var(--bg-alt);padding:4px;border-radius:var(--r-md);border:1px solid var(--border);}
  [data-theme="dark"] .seg{background:rgba(0,0,0,.25);}
  .seg button{border:none;background:transparent;color:var(--text-muted);border-radius:8px;padding:6px 13px;cursor:pointer;font-family:var(--mono);font-size:14px;transition:var(--ease) .18s;}
  .seg button.on{background:var(--primary);color:#fff;box-shadow:var(--glow-blue);}
  .seg button:hover:not(.on){color:var(--text);}
  .pillbtn{margin-left:auto;}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--r-md);padding:8px 14px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px;backdrop-filter:var(--glass-blur);transition:var(--ease) .2s;}
  .btn:hover{border-color:var(--border-hover);background:var(--surface-hover);transform:translateY(-1px);}
  .btn svg{width:15px;height:15px;}
  .toast{font-size:12.5px;color:var(--ok-fg);min-width:46px;}

  .bar{display:flex;height:22px;border-radius:10px;overflow:hidden;border:1px solid var(--border);margin-bottom:6px;}
  .bar div{transition:flex-basis .5s var(--ease);}

  .row{display:flex;gap:16px;align-items:stretch;padding:15px 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .chip{width:104px;min-height:104px;flex:0 0 104px;border-radius:16px;display:flex;align-items:flex-end;padding:10px;cursor:pointer;transition:var(--ease) .2s;}
  .chip:hover{transform:scale(1.03);}
  .chip b{font-family:var(--mono);font-size:16px;font-weight:500;}
  .vals{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:9px 22px;align-content:center;}
  .v{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13.5px;}
  .v .k{font-family:var(--sans);font-weight:500;color:var(--text-faint);width:36px;font-size:12px;}
  .cp{margin-left:auto;cursor:pointer;color:var(--text-faint);display:flex;transition:.15s;}
  .cp svg{width:15px;height:15px;}
  .cp:hover{color:var(--primary);}

  .cold{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:22px;padding:18px 20px;border-radius:var(--r-lg);background:var(--bg-alt);border:1px solid var(--border);}
  [data-theme="dark"] .cold{background:rgba(0,0,0,.22);}
  .cold .num{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.01em;}
  .cold input{width:54px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 6px;font-family:var(--mono);font-size:13px;text-align:center;}
  .cold input:focus{outline:none;border-color:var(--primary);box-shadow:var(--glow-blue);}
  .status{font-size:12.5px;font-weight:500;padding:5px 13px;border-radius:var(--r-full);}

  .feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px;}
  .feat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;backdrop-filter:var(--glass-blur);}
  .feat svg{width:20px;height:20px;color:var(--primary);margin-bottom:10px;}
  .feat h3{font-size:14.5px;font-weight:600;font-family:var(--sans);}
  .feat p{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
  footer{text-align:center;margin-top:42px;font-size:12.5px;color:var(--text-faint);}
  @media(max-width:680px){h1{font-size:40px;}.feats{grid-template-columns:1fr;}.vals{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand"><span class="mark"><span></span></span>Palette</div>
    <button id="theme" class="ghost" title="切换深浅色" aria-label="切换深浅色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>

  <header class="hero">
    <div class="badge"><span class="dot"></span>本地运行 · 图片不上传</div>
    <h1>一键提取<br>图片<em>主色</em></h1>
    <p class="lead">拖入一张图，得到 3–6 个主色及其占比，每色给出 HEX · RGB · HSB · HSL，并实时算出冷色占比。</p>
  </header>

  <section class="panel">
    <div id="drop" class="drop">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 16l4.5-4.5a2 2 0 0 1 2.8 0L16 16"/><path d="M14 14l1.5-1.5a2 2 0 0 1 2.8 0L20 14"/><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.4"/></svg></div>
      <div class="t1">拖拽图片到这里</div>
      <div class="t2">点击上传 · 或直接粘贴 ⌘V</div>
    </div>
    <input id="file" type="file" accept="image/*" style="display:none;">

    <div id="result" class="result">
      <div class="ctl">
        <img id="thumb" class="thumb" alt="预览，点击换图" title="点击换图">
        <span class="lbl">颜色数</span>
        <span id="kbtns" class="seg"></span>
        <button id="copyjson" class="btn pillbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>复制 JSON</button>
        <button id="dljson" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg>下载</button>
        <span id="toast" class="toast"></span>
      </div>
      <div id="bar" class="bar"></div>
      <div id="rows"></div>
      <div class="cold">
        <div>
          <div class="lbl">冷色占比</div>
          <div id="coldnum" class="num">–</div>
        </div>
        <span id="status" class="status"></span>
        <div class="lbl" style="display:flex;align-items:center;gap:7px;">hue
          <input id="hmin" type="number" min="0" max="360" value="160"> –
          <input id="hmax" type="number" min="0" max="360" value="270">°
        </div>
      </div>
    </div>
  </section>

  <div class="feats">
    <div class="feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><h3>纯本地隐私</h3><p>图片只在浏览器里解析，不上传任何服务器。</p></div>
    <div class="feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v4h-4"/></svg><h3>结果可复现</h3><p>固定种子的 k-means，同图同参数稳定输出。</p></div>
    <div class="feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18M3 12h18"/></svg><h3>HSB · HSL · 占比</h3><p>四套色值齐全，可导出 JSON 接入下游流程。</p></div>
  </div>

  <footer>Palette · 基于 k-means(k-means++) 主色聚类 · 本地运行</footer>
</div>

<script>
(function(){
  var k=4,lastImg=null,clusters=[],total=0,palette=[];
  var $=function(id){return document.getElementById(id);};
  var drop=$('drop'),file=$('file'),result=$('result'),rows=$('rows'),bar=$('bar'),thumb=$('thumb'),
      kbtns=$('kbtns'),coldnum=$('coldnum'),status=$('status'),toast=$('toast'),hmin=$('hmin'),hmax=$('hmax');

  $('theme').onclick=function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');};

  [3,4,5,6].forEach(function(n){var b=document.createElement('button');b.textContent=n;if(n===k)b.className='on';
    b.onclick=function(){k=n;[].forEach.call(kbtns.children,function(c){c.className=+c.textContent===k?'on':'';});if(lastImg)process(lastImg);};kbtns.appendChild(b);});

  function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h,s,l=(mx+mn)/2;if(mx===mn){h=s=0;}else{var d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}return[h*360,s*100,l*100];}
  function rgb2hsb(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h,s=mx===0?0:d/mx,v=mx;if(d===0)h=0;else{if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}return[h*360,s*100,v*100];}
  function hx(r,g,b){return'#'+[r,g,b].map(function(x){return('0'+x.toString(16)).slice(-2);}).join('').toUpperCase();}
  function lum(r,g,b){return .2126*r+.7152*g+.0722*b;}
  function R(n){return Math.round(n);}
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function hash(data){var h=2166136261;for(var i=0;i<data.length;i+=4){h^=data[i];h=Math.imul(h,16777619);h^=data[i+1];h=Math.imul(h,16777619);h^=data[i+2];h=Math.imul(h,16777619);}return h>>>0;}

  function kmeans(pts,k,rng){var n=pts.length;if(!n)return[];var cs=[pts[(rng()*n)|0].slice()];
    while(cs.length<k){var d2=new Array(n),sum=0;for(var i=0;i<n;i++){var m=Infinity;for(var c=0;c<cs.length;c++){var dd=Math.pow(pts[i][0]-cs[c][0],2)+Math.pow(pts[i][1]-cs[c][1],2)+Math.pow(pts[i][2]-cs[c][2],2);if(dd<m)m=dd;}d2[i]=m;sum+=m;}
      var r=rng()*sum,idx=0;for(idx=0;idx<n-1;idx++){r-=d2[idx];if(r<=0)break;}cs.push(pts[idx].slice());}
    var assign=new Array(n).fill(0);
    for(var it=0;it<16;it++){for(var i2=0;i2<n;i2++){var mm=Infinity,mi=0;for(var c2=0;c2<k;c2++){var e=Math.pow(pts[i2][0]-cs[c2][0],2)+Math.pow(pts[i2][1]-cs[c2][1],2)+Math.pow(pts[i2][2]-cs[c2][2],2);if(e<mm){mm=e;mi=c2;}}assign[i2]=mi;}
      var sm=[];for(var s=0;s<k;s++)sm.push([0,0,0,0]);for(var i3=0;i3<n;i3++){var a=assign[i3];sm[a][0]+=pts[i3][0];sm[a][1]+=pts[i3][1];sm[a][2]+=pts[i3][2];sm[a][3]++;}
      for(var c3=0;c3<k;c3++)if(sm[c3][3])cs[c3]=[sm[c3][0]/sm[c3][3],sm[c3][1]/sm[c3][3],sm[c3][2]/sm[c3][3]];}
    var cnt=new Array(k).fill(0);for(var i4=0;i4<n;i4++)cnt[assign[i4]]++;
    return cs.map(function(c,i){return{rgb:[R(c[0]),R(c[1]),R(c[2])],count:cnt[i]};}).filter(function(c){return c.count>0;});}

  function process(img){var d=160,w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,d/Math.max(w,h)),cw=Math.max(1,R(w*sc)),ch=Math.max(1,R(h*sc));
    var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;var ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,cw,ch);
    var data;try{data=ctx.getImageData(0,0,cw,ch).data;}catch(e){return;}
    var pts=[];for(var i=0;i<data.length;i+=4){if(data[i+3]<125)continue;pts.push([data[i],data[i+1],data[i+2]]);}
    var rng=mulberry32((hash(data)^(k*2654435761))>>>0);
    clusters=kmeans(pts,k,rng).sort(function(a,b){return b.count-a.count;});
    total=clusters.reduce(function(a,c){return a+c.count;},0);render();}

  var copyIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
  function vrow(l,v){return '<div class="v"><span class="k">'+l+'</span><span>'+v+'</span><span class="cp" data-c="'+v+'">'+copyIcon+'</span></div>';}

  function render(){if(!total)return;
    bar.innerHTML=clusters.map(function(c){return '<div style="flex:0 0 '+(c.count/total*100)+'%;background:'+hx(c.rgb[0],c.rgb[1],c.rgb[2])+'"></div>';}).join('');
    palette=[];
    rows.innerHTML=clusters.map(function(c){var r=c.rgb[0],g=c.rgb[1],b=c.rgb[2],p=c.count/total*100,hsl=rgb2hsl(r,g,b),hsb=rgb2hsb(r,g,b),H=R(hsl[0]),txt=lum(r,g,b)>150?'#0C0C0E':'#fff';
      palette.push({hex:hx(r,g,b),rgb:[r,g,b],hsb:[H,R(hsb[1]),R(hsb[2])],hsl:[H,R(hsl[1]),R(hsl[2])],ratio:+p.toFixed(1)});
      return '<div class="row"><div class="chip" data-c="'+hx(r,g,b)+'" style="background:'+hx(r,g,b)+';color:'+txt+'" title="点击复制 HEX"><b>'+p.toFixed(1)+'%</b></div><div class="vals">'+
        vrow('HEX',hx(r,g,b))+vrow('RGB',r+', '+g+', '+b)+vrow('HSB',H+'°, '+R(hsb[1])+'%, '+R(hsb[2])+'%')+vrow('HSL',H+'°, '+R(hsl[1])+'%, '+R(hsl[2])+'%')+'</div></div>';}).join('');
    recompute();result.style.display='block';}

  function recompute(){if(!total)return;var lo=+hmin.value,hi=+hmax.value,cold=0;
    clusters.forEach(function(c){var hsl=rgb2hsl(c.rgb[0],c.rgb[1],c.rgb[2]);if(hsl[0]>=lo&&hsl[0]<=hi&&hsl[1]>12)cold+=c.count/total*100;});
    coldnum.textContent=cold.toFixed(1)+'%';var ok=cold>=60;
    status.textContent=ok?'达标 ≥60%':'未达标 <60%';
    status.style.background=ok?'var(--ok-bg)':'var(--bad-bg)';status.style.color=ok?'var(--ok-fg)':'var(--bad-fg)';
    status.style.boxShadow='0 0 18px '+(ok?'var(--ok-glow)':'var(--bad-glow)');}
  hmin.oninput=recompute;hmax.oninput=recompute;

  function flash(t){toast.textContent=t;setTimeout(function(){toast.textContent='';},1100);}
  function cp(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){flash('已复制');},fb);}else fb();
    function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flash('已复制');}catch(e){}document.body.removeChild(ta);}}
  rows.addEventListener('click',function(e){var c=e.target.closest('.cp');if(c){cp(c.getAttribute('data-c'));return;}var ch=e.target.closest('.chip');if(ch)cp(ch.getAttribute('data-c'));});
  $('copyjson').onclick=function(){cp(JSON.stringify(palette,null,2));};
  $('dljson').onclick=function(){var blob=new Blob([JSON.stringify(palette,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='palette.json';a.click();URL.revokeObjectURL(a.href);};

  function load(src){var img=new Image();img.onload=function(){lastImg=img;thumb.src=src;process(img);};img.src=src;}
  function handle(f){if(!f||!/^image\//.test(f.type))return;var rd=new FileReader();rd.onload=function(ev){load(ev.target.result);};rd.readAsDataURL(f);}
  drop.onclick=function(){file.click();};thumb.onclick=function(){file.click();};
  file.onchange=function(e){handle(e.target.files[0]);};
  drop.ondragover=function(e){e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=function(){drop.classList.remove('over');};
  drop.ondrop=function(e){e.preventDefault();drop.classList.remove('over');handle(e.dataTransfer.files[0]);};
  window.addEventListener('paste',function(e){var it=(e.clipboardData||{}).items||[];for(var i=0;i<it.length;i++)if(it[i].type.indexOf('image')===0){handle(it[i].getAsFile());break;}});
})();
</script>
